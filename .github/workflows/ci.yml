name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  cek:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # LayoutProps/PageProps adalah tipe global hasil generate Next; belum ada di checkout bersih.
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
